<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>لعبة سباق حمودي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a0c12;
    --asphalt:#181c25;
    --asphalt-2:#20242f;
    --amber:#f2b83d;
    --cyan:#3ee6d8;
    --orange:#ff6a3d;
    --danger:#ff3b5c;
    --ghost:#7c8494;
    --white:#eef1f6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%; margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #1a2233 0%, transparent 60%),
      var(--bg-deep);
    font-family:'Cairo',sans-serif;
    color:var(--white);
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  #stage{
    position:relative;
    width:min(96vw, 460px);
    height:min(96vh, 820px);
    aspect-ratio: 460/820;
    display:flex; flex-direction:column;
    filter:drop-shadow(0 20px 60px rgba(0,0,0,0.6));
  }
  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 16px 0;
    z-index:5; pointer-events:none;
  }
  .hud-block{ display:flex; flex-direction:column; gap:2px; }
  .hud-label{
    font-size:10px; letter-spacing:2px; color:var(--ghost);
    font-weight:600;
  }
  .hud-value{
    font-family:'Orbitron',sans-serif; font-weight:700;
    font-size:22px; color:var(--white);
    text-shadow:0 0 12px rgba(62,230,216,0.35);
  }
  .hud-value.mult{ color:var(--amber); text-shadow:0 0 12px rgba(242,184,61,0.45); }
  .hud-center{ text-align:center; }
  #canvasWrap{
    position:relative; flex:1; border-radius:18px; overflow:hidden;
    border:1px solid rgba(255,255,255,0.06);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4), inset 0 40px 80px rgba(0,0,0,0.5);
  }
  canvas{ display:block; width:100%; height:100%; background:var(--asphalt); }

  #touchZones{
    position:absolute; inset:0; display:flex; z-index:4;
  }
  #touchZones div{ flex:1; }

  .overlay{
    position:absolute; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, rgba(10,12,18,0.88), rgba(10,12,18,0.96));
    backdrop-filter: blur(3px);
    text-align:center;
    transition:opacity .25s ease;
  }
  .overlay.hidden{ opacity:0; pointer-events:none; }
  .panel{ display:flex; flex-direction:column; align-items:center; gap:10px; padding:0 28px; }
  .eyebrow{
    font-size:11px; letter-spacing:4px; color:var(--cyan);
    font-weight:700; text-transform:uppercase;
  }
  .title{
    font-family:'Orbitron',sans-serif; font-weight:900;
    font-size:clamp(26px,7vw,34px); line-height:1.15;
    background:linear-gradient(90deg, var(--amber), var(--orange));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin:2px 0 6px;
  }
  .desc{ color:var(--ghost); font-size:14px; max-width:280px; line-height:1.8; margin-bottom:6px;}
  .stat-row{ display:flex; gap:26px; margin:6px 0 4px; }
  .stat{ display:flex; flex-direction:column; align-items:center; gap:2px;}
  .stat .n{ font-family:'Orbitron',sans-serif; font-size:28px; font-weight:700; color:var(--white); }
  .stat .l{ font-size:10px; letter-spacing:2px; color:var(--ghost); }
  .stat.best .n{ color:var(--amber); }
  .newbest{
    font-size:12px; color:var(--amber); font-weight:700; letter-spacing:1px;
    opacity:0; transform:translateY(4px); transition:all .3s ease;
  }
  .newbest.show{ opacity:1; transform:translateY(0); }
  button.playBtn{
    margin-top:14px;
    font-family:'Cairo',sans-serif; font-weight:700; font-size:16px;
    color:#12141c; background:linear-gradient(135deg, var(--amber), var(--orange));
    border:none; padding:14px 40px; border-radius:100px; cursor:pointer;
    box-shadow:0 8px 24px rgba(255,106,61,0.35), 0 0 0 1px rgba(255,255,255,0.08) inset;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  button.playBtn:active{ transform:scale(0.95); box-shadow:0 4px 14px rgba(255,106,61,0.3); }
  .hint{ margin-top:14px; font-size:11px; color:var(--ghost); letter-spacing:.5px;}
  .hint b{ color:var(--white); }

  #countdown{
    position:absolute; inset:0; z-index:9; display:none;
    align-items:center; justify-content:center;
    font-family:'Orbitron',sans-serif; font-weight:900; font-size:90px;
    color:var(--amber); text-shadow:0 0 30px rgba(242,184,61,0.6);
  }

  #muteBtn{
    position:absolute; bottom:14px; left:14px; z-index:6;
    width:38px; height:38px; border-radius:50%;
    background:rgba(20,22,30,0.6); border:1px solid rgba(255,255,255,0.14);
    color:var(--white); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    backdrop-filter: blur(4px);
    transition:transform .12s ease, background .12s ease;
  }
  #muteBtn:active{ transform:scale(0.9); }
  #muteBtn.off{ color:var(--ghost); }

  .popup-text{
    position:absolute; font-family:'Orbitron',sans-serif; font-weight:700;
    pointer-events:none;
  }
</style>
</head>
<body>

<div id="stage">
  <div id="hud">
    <div class="hud-block">
      <div class="hud-label">المسافة</div>
      <div class="hud-value" id="hudDistance">0</div>
    </div>
    <div class="hud-block hud-center">
      <div class="hud-label">أفضل نتيجة</div>
      <div class="hud-value" id="hudBest">0</div>
    </div>
    <div class="hud-block" style="align-items:flex-end;">
      <div class="hud-label">السرعة</div>
      <div class="hud-value mult" id="hudMult">×1.0</div>
    </div>
  </div>

  <div id="canvasWrap">
    <canvas id="game"></canvas>
    <div id="touchZones">
      <div id="zoneLeft"></div>
      <div id="zoneRight"></div>
    </div>
    <div id="countdown">3</div>
    <button id="muteBtn" title="تشغيل/كتم الصوت" aria-label="تشغيل أو كتم الصوت">🔊</button>

    <div class="overlay" id="startOverlay">
      <div class="panel">
        <div class="eyebrow">سباق حمودي</div>
        <div class="title">تفادَ<br>وسابق الطريق</div>
        <div class="desc">اسحب سيارتك بين المسارات الثلاثة وتجنّب السيارات القادمة. السرعة تزداد كلما طالت المسافة.</div>
        <button class="playBtn" id="startBtn">ابدأ السباق</button>
        <div class="hint">استخدم <b>← →</b> أو اضغط <b>يمين / يسار</b> الشاشة</div>
      </div>
    </div>

    <div class="overlay hidden" id="endOverlay">
      <div class="panel">
        <div class="eyebrow" id="endEyebrow">انتهت الجولة</div>
        <div class="title" id="endTitle">اصطدمت!</div>
        <div class="stat-row">
          <div class="stat">
            <div class="n" id="endDistance">0</div>
            <div class="l">المسافة</div>
          </div>
          <div class="stat best">
            <div class="n" id="endBest">0</div>
            <div class="l">أفضل نتيجة</div>
          </div>
        </div>
        <div class="newbest" id="newBestTag">رقم قياسي جديد ⚡</div>
        <button class="playBtn" id="retryBtn">العب مرة أخرى</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('canvasWrap');

  const hudDistance = document.getElementById('hudDistance');
  const hudBest = document.getElementById('hudBest');
  const hudMult = document.getElementById('hudMult');
  const startOverlay = document.getElementById('startOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const endDistanceEl = document.getElementById('endDistance');
  const endBestEl = document.getElementById('endBest');
  const newBestTag = document.getElementById('newBestTag');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const countdownEl = document.getElementById('countdown');
  const muteBtn = document.getElementById('muteBtn');

  // ---- audio engine (synthesized, no external files) ----
  let audioCtx = null;
  let soundOn = true;

  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch(e){ audioCtx = null; }
    } else if(audioCtx.state === 'suspended'){
      audioCtx.resume();
    }
  }

  function playTone(freq, duration, type, delay, peak){
    if(!audioCtx || !soundOn) return;
    const t0 = audioCtx.currentTime + (delay || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(peak || 0.25, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.03);
  }

  function sfxCoin(){
    if(!audioCtx || !soundOn) return;
    playTone(880, 0.09, 'triangle', 0, 0.22);
    playTone(1318, 0.13, 'triangle', 0.05, 0.18);
  }

  function sfxCollision(){
    if(!audioCtx || !soundOn) return;
    const t0 = audioCtx.currentTime;
    const dur = 0.28;
    const bufferSize = Math.floor(audioCtx.sampleRate * dur);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(2200, t0);
    filter.frequency.exponentialRampToValueAtTime(110, t0 + dur);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.5, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    noise.connect(filter).connect(gain).connect(audioCtx.destination);
    noise.start(t0);
    noise.stop(t0 + dur);
    playTone(85, 0.3, 'square', 0, 0.28);
  }

  function sfxGameOver(){
    if(!audioCtx || !soundOn) return;
    const notes = [440, 349, 294, 220];
    notes.forEach((f, i) => playTone(f, 0.3, 'triangle', 0.32 + i*0.15, 0.18));
  }

  muteBtn.addEventListener('click', ()=>{
    soundOn = !soundOn;
    muteBtn.textContent = soundOn ? '🔊' : '🔇';
    muteBtn.classList.toggle('off', !soundOn);
    if(soundOn) ensureAudio();
  });

  // ---- internal resolution ----
  let W = 460, H = 820;
  function resize(){
    const rect = wrap.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = rect.width; H = rect.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resize);

  // ---- constants ----
  const LANES = 3;
  const BASE_SPEED = 260;      // px/s falling speed at start
  const MAX_SPEED = 780;       // px/s cap
  const SPEED_RAMP = 16;       // px/s^2 growth
  const SMOOTH_LANE = 9;       // lane-switch smoothing rate

  let laneWidth, laneCenters;
  function computeLanes(){
    laneWidth = W / LANES;
    laneCenters = [0,1,2].map(i => laneWidth*(i+0.5));
  }

  // ---- state ----
  let state = 'start'; // start | countdown | playing | gameover
  let best = 0;
  let elapsed = 0;
  let distance = 0;
  let speed = BASE_SPEED;
  let player, enemies, coins, popups, roadOffset, spawnTimer, spawnInterval, lastLaneSpawned, sameLaneStreak;
  let coinSpawnTimer, coinSpawnInterval;
  let last = 0;
  let shake = 0;
  let countdownVal = 3;
  let countdownTimer = 0;

  function resetGame(){
    computeLanes();
    player = {
      lane: 1,
      x: laneCenters[1],
      y: H - 130,
      w: Math.min(58, laneWidth*0.62),
      h: 92,
    };
    enemies = [];
    coins = [];
    popups = [];
    roadOffset = 0;
    elapsed = 0;
    distance = 0;
    speed = BASE_SPEED;
    spawnTimer = 0;
    spawnInterval = 850;
    coinSpawnTimer = 600;
    coinSpawnInterval = 1400;
    lastLaneSpawned = -1;
    sameLaneStreak = 0;
    shake = 0;
  }

  function setLane(delta){
    if(state !== 'playing') return;
    player.lane = Math.max(0, Math.min(LANES-1, player.lane + delta));
  }

  // ---- input ----
  window.addEventListener('keydown', (e)=>{
    if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') setLane(-1);
    else if(e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') setLane(1);
    else if((e.key === 'Enter' || e.key === ' ') && state === 'start') beginCountdown();
  });

  document.getElementById('zoneLeft').addEventListener('pointerdown', ()=> setLane(-1));
  document.getElementById('zoneRight').addEventListener('pointerdown', ()=> setLane(1));

  // swipe support
  let touchStartX = null;
  wrap.addEventListener('touchstart', (e)=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
  wrap.addEventListener('touchend', (e)=>{
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40){ setLane(dx > 0 ? 1 : -1); }
    touchStartX = null;
  }, {passive:true});

  startBtn.addEventListener('click', beginCountdown);
  retryBtn.addEventListener('click', beginCountdown);

  function beginCountdown(){
    ensureAudio();
    resetGame();
    startOverlay.classList.add('hidden');
    endOverlay.classList.add('hidden');
    state = 'countdown';
    countdownVal = 3;
    countdownTimer = 0;
    countdownEl.style.display = 'flex';
    countdownEl.textContent = countdownVal;
  }

  function gameOver(){
    state = 'gameover';
    shake = 14;
    sfxCollision();
    sfxGameOver();
    const dist = Math.floor(distance);
    const isNew = dist > best;
    if(isNew) best = dist;
    endDistanceEl.textContent = dist;
    endBestEl.textContent = best;
    newBestTag.classList.toggle('show', isNew);
    hudBest.textContent = best;
    setTimeout(()=> endOverlay.classList.remove('hidden'), 260);
  }

  // ---- spawning ----
  function trySpawn(dt){
    spawnTimer -= dt*1000;
    if(spawnTimer > 0) return;
    spawnInterval = Math.max(430, 900 - (speed-BASE_SPEED)*0.7);
    spawnTimer = spawnInterval * (0.85 + Math.random()*0.3);

    let lane = Math.floor(Math.random()*LANES);
    if(lane === lastLaneSpawned){
      sameLaneStreak++;
      if(sameLaneStreak >= 2){
        lane = (lane + 1 + Math.floor(Math.random()*2)) % LANES;
        sameLaneStreak = 0;
      }
    } else sameLaneStreak = 0;
    lastLaneSpawned = lane;

    // ensure not blocking all lanes simultaneously near same y
    const recentLanesBlocked = new Set(
      enemies.filter(e => e.y < 160).map(e => e.lane)
    );
    if(recentLanesBlocked.size >= LANES-1 && !recentLanesBlocked.has(lane)){
      // fine, this keeps one lane open
    } else if(recentLanesBlocked.size >= LANES-1){
      return; // skip spawn, avoid impossible wall
    }

    const w = Math.min(56, laneWidth*0.6);
    const h = 86;
    const palette = ['#ff6a3d','#3ee6d8','#c792ea','#ff3b5c','#6fd66f','#5ea1ff'];
    enemies.push({
      lane, x: laneCenters[lane], y: -h-10, w, h,
      color: palette[Math.floor(Math.random()*palette.length)]
    });
  }

  function trySpawnCoin(dt){
    coinSpawnTimer -= dt*1000;
    if(coinSpawnTimer > 0) return;
    coinSpawnInterval = Math.max(900, 1500 - (speed-BASE_SPEED)*0.4);
    coinSpawnTimer = coinSpawnInterval * (0.8 + Math.random()*0.5);

    // prefer a lane that's currently clear near the top
    const blocked = new Set(enemies.filter(e => e.y < 220).map(e => e.lane));
    const free = [0,1,2].filter(l => !blocked.has(l));
    const lane = free.length ? free[Math.floor(Math.random()*free.length)]
                              : Math.floor(Math.random()*LANES);

    coins.push({ lane, x: laneCenters[lane], y: -40, r: Math.min(16, laneWidth*0.16), spin: Math.random()*Math.PI*2 });
  }

  // ---- drawing helpers ----
  function drawCar(x, y, w, h, bodyColor, glow){
    ctx.save();
    ctx.translate(x, y);
    if(glow){
      ctx.shadowColor = bodyColor;
      ctx.shadowBlur = 18;
    }
    // body
    const r = w*0.22;
    ctx.fillStyle = bodyColor;
    roundRect(-w/2, -h/2, w, h, r);
    ctx.fill();
    ctx.shadowBlur = 0;
    // cabin
    ctx.fillStyle = 'rgba(10,12,18,0.55)';
    roundRect(-w*0.32, -h*0.22, w*0.64, h*0.4, w*0.14);
    ctx.fill();
    // headlights / tail
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(-w*0.36, -h*0.48, w*0.2, h*0.07);
    ctx.fillRect(w*0.16, -h*0.48, w*0.2, h*0.07);
    // wheels
    ctx.fillStyle = '#0c0d12';
    const ww = w*0.16, wh = h*0.16;
    ctx.fillRect(-w/2-ww*0.35, -h*0.28, ww, wh);
    ctx.fillRect(w/2-ww*0.65, -h*0.28, ww, wh);
    ctx.fillRect(-w/2-ww*0.35, h*0.12, ww, wh);
    ctx.fillRect(w/2-ww*0.65, h*0.12, ww, wh);
    ctx.restore();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawCoin(x, y, r, spin){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(spin);
    ctx.shadowColor = '#f2b83d';
    ctx.shadowBlur = 14;
    const grad = ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.1, 0,0,r);
    grad.addColorStop(0, '#fff3c4');
    grad.addColorStop(0.55, '#f2b83d');
    grad.addColorStop(1, '#c98a1f');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0,0,r,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = Math.max(1.5, r*0.14);
    ctx.beginPath();
    ctx.arc(0,0,r*0.55,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  function drawPopups(dt){
    for(let i=popups.length-1;i>=0;i--){
      const p = popups[i];
      p.life -= dt;
      p.y -= 38*dt;
      if(p.life <= 0){ popups.splice(i,1); continue; }
      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#f2b83d';
      ctx.font = "700 15px 'Orbitron', sans-serif";
      ctx.textAlign = 'center';
      ctx.shadowColor = '#f2b83d';
      ctx.shadowBlur = 8;
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    }
  }

  function drawRoad(dt){
    ctx.fillStyle = '#181c25';
    ctx.fillRect(0,0,W,H);

    // side asphalt shading
    const grad = ctx.createLinearGradient(0,0,W,0);
    grad.addColorStop(0,'rgba(0,0,0,0.35)');
    grad.addColorStop(0.15,'rgba(0,0,0,0)');
    grad.addColorStop(0.85,'rgba(0,0,0,0)');
    grad.addColorStop(1,'rgba(0,0,0,0.35)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);

    // lane dividers
    ctx.strokeStyle = 'rgba(242,184,61,0.55)';
    ctx.lineWidth = 4;
    ctx.setLineDash([28, 26]);
    for(let i=1;i<LANES;i++){
      const x = laneWidth*i;
      ctx.beginPath();
      ctx.moveTo(x, -roadOffset % 54);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // edge lines
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(6,0); ctx.lineTo(6,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W-6,0); ctx.lineTo(W-6,H); ctx.stroke();
  }

  // ---- main loop ----
  function frame(t){
    requestAnimationFrame(frame);
    if(!last) last = t;
    let dt = (t - last)/1000;
    dt = Math.min(dt, 0.033);
    last = t;

    if(state === 'countdown'){
      countdownTimer += dt*1000;
      if(countdownTimer > 700){
        countdownTimer = 0;
        countdownVal--;
        if(countdownVal <= 0){
          countdownEl.style.display = 'none';
          state = 'playing';
        } else {
          countdownEl.textContent = countdownVal;
        }
      }
    }

    const active = (state === 'playing');

    if(active){
      elapsed += dt;
      speed = Math.min(MAX_SPEED, BASE_SPEED + elapsed*SPEED_RAMP);
      distance += speed*dt*0.12;
      roadOffset += speed*dt;

      // smooth lane follow
      const targetX = laneCenters[player.lane];
      const s = 1 - Math.exp(-SMOOTH_LANE*dt);
      player.x += (targetX - player.x) * s;

      trySpawn(dt);
      trySpawnCoin(dt);

      for(let i=enemies.length-1;i>=0;i--){
        const e = enemies[i];
        e.y += speed*dt;
        e.x += (laneCenters[e.lane] - e.x) * (1-Math.exp(-12*dt));
        if(e.y - e.h/2 > H + 20){ enemies.splice(i,1); continue; }

        // collision (slightly forgiving box)
        const pad = 6;
        if(Math.abs(e.x - player.x) < (e.w+player.w)/2 - pad &&
           Math.abs(e.y - player.y) < (e.h+player.h)/2 - pad){
          gameOver();
          break;
        }
      }

      for(let i=coins.length-1;i>=0;i--){
        const c = coins[i];
        c.y += speed*dt;
        c.spin += dt*4;
        if(c.y - c.r > H + 20){ coins.splice(i,1); continue; }

        const dx = Math.abs(c.x - player.x);
        const dy = Math.abs(c.y - player.y);
        if(dx < (player.w/2 + c.r*0.7) && dy < (player.h/2 + c.r*0.7)){
          const bonus = 60;
          distance += bonus;
          sfxCoin();
          popups.push({ x: c.x, y: c.y, text: '+'+bonus, life: 0.7, maxLife: 0.7 });
          coins.splice(i,1);
        }
      }

      hudDistance.textContent = Math.floor(distance);
      hudMult.textContent = '×' + (speed/BASE_SPEED).toFixed(1);
    }

    if(shake > 0) shake *= 0.88;

    // ---- render ----
    ctx.save();
    if(shake > 0.3){
      ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }
    drawRoad(dt);

    for(const c of coins){
      drawCoin(c.x, c.y, c.r, c.spin);
    }

    for(const e of enemies){
      drawCar(e.x, e.y, e.w, e.h, e.color, false);
    }

    if(state !== 'start'){
      drawCar(player.x, player.y, player.w, player.h, '#f2b83d', true);
    }

    if(active) drawPopups(dt);
    ctx.restore();
  }

  // init
  resize();
  computeLanes();
  resetGame();
  hudDistance.textContent = '0';
  hudBest.textContent = '0';
  hudMult.textContent = '×1.0';
  requestAnimationFrame(frame);

  window.addEventListener('resize', ()=>{
    resize(); computeLanes();
    if(player) player.x = laneCenters[player.lane];
  });
})();
</script>
</body>
